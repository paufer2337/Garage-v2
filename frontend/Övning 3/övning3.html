<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>SmartParking Live | Garagekarta och lediga platser</title>
        <meta name="description" content="Se lediga parkeringsplatser i realtid med SmartParking Live.">
        
        <link rel="stylesheet" href="övning3.css">
    </head>
<body>

    <header id="header-section">
        <h1 class="logo">SmartParking Live</h1>
        <nav class="menu-links">
            <a href="#karta">Karta</a><a href="#info">Info</a>
        </nav>
    </header>

    <main id="content-area">
        
        <div class="garage-container">
            <h2>Live-vy: Garageplan A</h2>
            <p>Klicka på en ruta för att se detaljer.</p>
            
            <div class="floor-layout">
                <button type="button" class="spot" aria-label="Parkeringsruta 1: UPPTAGEN">
                    <span aria-hidden="true">🚗</span>
                </button>

                <button type="button" class="spot" aria-label="Parkeringsruta 2: UPPTAGEN">
                    <span aria-hidden="true">🚗</span>
                </button>

                <button type="button" class="spot" aria-label="Parkeringsruta 3: LEDIG PLATS">
                    <span aria-hidden="true">🅿️</span>
                </button>

                <button type="button" class="spot" aria-label="Parkeringsruta 4: UPPTAGEN">
                    <span aria-hidden="true">🚗</span>
                </button>
            </div>
            
        </div>

        <div class="info-sidebar">
            <h2>Priser och Regler</h2>
            <p>Standardtaxa: 20kr/h. Orangea streckade linjer visar zongränsen.</p>
        </div>

    </main>

    <footer id="footer-area">
        <p>© 2026 SmartParking AB</p>
    </footer>

</body>
</html>
